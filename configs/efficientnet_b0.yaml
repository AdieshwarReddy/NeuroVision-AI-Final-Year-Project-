# ============================================================
# EfficientNet-B0 Candidate — Hardware-Aware Config
# Intel Iris Xe CPU-only: reduced batch, no pin_memory
# ============================================================
experiment_name: "candidate_efficientnet_b0_fold1"
model_name: "efficientnet_b0"
pretrained: true
dropout_rate: 0.3

# Input
target_size: [224, 224]
fold: 1

# Hardware-aware batch settings (Intel Iris Xe, 16GB RAM)
# batch_size=16 keeps per-epoch RAM usage ~2-3 GB
batch_size: 16
num_workers: 0        # Avoids multiprocessing overhead on Windows
cache_in_memory: true # Pre-loads all slices for fast epochs

# Two-stage transfer learning
stage1_epochs: 5      # Head-only warmup
stage2_epochs: 15     # End-to-end fine-tuning
lr_stage1: 0.001
lr_stage2: 0.0001
weight_decay: 0.0001

# Early stopping
patience: 7

# Class weighting (off — dataset is roughly balanced after patient split)
use_class_weights: false

# Reproducibility
random_seed: 42
